name: Publicar la web en GitHub Pages

# Publica la carpeta docs/ cuando GitHub Pages está configurado con «Source: GitHub Actions».
# Si Pages usa «Deploy from a branch» (main /docs), GitHub la publica por su cuenta y este flujo no hace nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "off")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "off" ]; then
            echo "::notice::GitHub Pages no está activado. Actívalo en Settings → Pages → Source: GitHub Actions."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
