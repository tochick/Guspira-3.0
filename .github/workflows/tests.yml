name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de la API
        run: node test.cjs
      - name: La demo de docs/ está al día
        run: |
          node demo/build-demo.cjs
          git diff --exit-code -- docs/ || (echo "Regenera la demo con: node demo/build-demo.cjs" && exit 1)
